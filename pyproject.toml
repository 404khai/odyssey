[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odyssey"
version = "0.0.0"
description = "A decoder-only transformer specializing in long-horizon reasoning and software architecture."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Odyssey Contributors" }]
keywords = ["transformer", "llm", "reasoning", "pytorch", "research"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch",
    "numpy",
    "transformers",
    "datasets",
    "sentencepiece",
    "matplotlib",
    "pyyaml",
    "tensorboard",
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "isort",
    "mypy",
    "pytest",
    "types-PyYAML",
]
tracking = [
    "wandb",
    "hydra-core",
]
all = [
    "odyssey[dev,tracking]",
]

[tool.setuptools.packages.find]
include = ["model*", "tokenizer*", "training*", "evaluation*", "odyssey*"]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["model", "tokenizer", "training", "evaluation", "odyssey"]
src_paths = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # line length handled by black
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
packages = ["model", "tokenizer", "training", "evaluation", "odyssey"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
