[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odyssey"
version = "0.4.0"
description = "A decoder-only transformer specializing in long-horizon reasoning and software architecture."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Odyssey Contributors" }]
keywords = ["transformer", "llm", "reasoning", "pytorch", "research", "tokenizer", "bpe"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch",
    "numpy",
    "transformers",
    "datasets",
    "sentencepiece",
    "matplotlib",
    "pyyaml",
    "tensorboard",
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "isort",
    "mypy",
    "pytest",
    "types-PyYAML",
]
tracking = [
    "wandb",
    "hydra-core",
]
all = [
    "odyssey[dev,tracking]",
]

[project.scripts]
odyssey-tokenizer = "tokenizer.cli.main:main"

[tool.setuptools]
packages = [
    "odyssey",
    "model",
    "training",
    "evaluation",
    "tokenizer",
    "tokenizer.sentencepiece",
    "tokenizer.cli",
    "tokenizer.benchmarks",
    "odyssey_tokenizer",
]

[tool.setuptools.package-dir]
"" = "."
"odyssey_tokenizer" = "tokenizer/odyssey_tokenizer"

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
known_first_party = [
    "model",
    "tokenizer",
    "training",
    "evaluation",
    "odyssey",
    "odyssey_tokenizer",
]
src_paths = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "B",
    "UP",
    "W",
]
ignore = [
    "E501",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
packages = ["model", "tokenizer", "training", "evaluation", "odyssey"]
exclude = "(?x)(^tokenizer/odyssey_tokenizer/)"

[tool.pytest.ini_options]
testpaths = ["tests", "tokenizer/tests"]
pythonpath = ["."]
addopts = "-ra"
