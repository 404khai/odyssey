# Odyssey tokenizer configuration (Phase 2 — owned BPE is primary)
# Phase 1 SentencePiece remains available as a reference backend.

algorithm: bpe  # bpe | sentencepiece

vocab_size: 32000
min_frequency: 2
byte_level: true
lowercase: false

# Reserved token IDs (stable across backends)
pad_id: 0
bos_id: 1
eos_id: 2
unk_id: 3

special_tokens:
  - "<pad>"
  - "<bos>"
  - "<eos>"
  - "<unk>"
  - "<mask>"
  - "<system>"
  - "<user>"
  - "<assistant>"
  - "<tool>"
  - "<think>"

normalization:
  form: NFKC
  collapse_whitespace: true
  preserve_newlines: true
  strip: true

training:
  input_sentence_size: 0
  shuffle_input_sentence: true
  seed: 42
  max_lines: 0                 # 0 = use all lines
  progress_every: 500

paths:
  model_dir: assets/tokenizer/bpe/odyssey.model
  merges_file: assets/tokenizer/bpe/odyssey.model/merges.txt
  vocab_file: assets/tokenizer/bpe/odyssey.model/vocab.json
  metadata_file: assets/tokenizer/bpe/odyssey.model/metadata.json
  visualization_dir: assets/tokenizer/bpe

# --- Phase 1 SentencePiece reference (unchanged semantics) ---
character_coverage: 0.9995
model_type: unigram
user_defined_symbols:
  - "<mask>"
  - "<system>"
  - "<user>"
  - "<assistant>"
  - "<tool>"
  - "<think>"

sentencepiece_training:
  input_sentence_size: 0
  shuffle_input_sentence: true
  num_threads: 4
  max_sentence_length: 8192
  hard_vocab_limit: false

sentencepiece_paths:
  model_prefix: assets/tokenizer/odyssey
  model_file: assets/tokenizer/odyssey.model
  vocab_file: assets/tokenizer/odyssey.vocab
  metadata_file: assets/tokenizer/metadata.json

# Legacy map used by SentencePiece wrapper
special_token_map:
  pad: "<pad>"
  bos: "<bos>"
  eos: "<eos>"
  unk: "<unk>"
  mask: "<mask>"
  system: "<system>"
  user: "<user>"
  assistant: "<assistant>"
  tool: "<tool>"
  think: "<think>"
