# Odyssey default configuration
# All hyperparameters should eventually flow from config files.

experiment:
  id: ODY-0006
  name: odyssey-swiglu-baseline
  seed: 42

model:
  name: odyssey-tiny
  vocabulary_size: 32000
  context_length: 2048
  hidden_size: 768
  num_layers: 12
  num_heads: 12
  intermediate_size: 2048
  embedding:
    padding_idx: 0
    init_strategy: xavier_uniform
    init_std: 0.02
    device: cpu
    dtype: float32
  rope:
    theta: 10000.0
    rotary_dim: 64
    max_position_embeddings: 2048
    scaling: none
    scaling_factor: 1.0
    device: cpu
    dtype: float32
  norm:
    type: rmsnorm
    epsilon: 0.000001
    device: cpu
    dtype: float32
  feed_forward:
    type: swiglu
    hidden_size: 768
    intermediate_size: 2048
    activation: silu
    device: cpu
    dtype: float32

tokenizer:
  path: assets/tokenizer/bpe/odyssey.model
  type: bpe
  config: configs/tokenizer.yaml

training:
  learning_rate: 3.0e-4
  optimizer: adamw
  batch_size: 8
  weight_decay: 0.1
  warmup_steps: 100
  max_steps: 10000

logging:
  backend: tensorboard   # options: tensorboard | wandb
  log_interval: 10
