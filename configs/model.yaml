# Odyssey model configuration (Phase 7+)

model:
  name: odyssey-tiny
  vocab_size: 32000
  hidden_size: 768
  intermediate_size: 2048
  num_layers: 12
  num_heads: 12
  num_kv_heads: 4
  context_length: 2048

  embedding:
    padding_idx: 0
    init_strategy: xavier_uniform
    init_std: 0.02
    device: cpu
    dtype: float32

  # RoPE — must stay aligned with Phalanx layers::Rope / Odyssey Spec v1
  rope:
    theta: 10000.0
    rotary_dim: 64
    max_position_embeddings: 2048
    scaling: none
    scaling_factor: 1.0
    device: cpu
    dtype: float32

  # RMSNorm — must stay aligned with Phalanx layers::RmsNorm
  norm:
    type: rmsnorm
    epsilon: 0.000001
    device: cpu
    dtype: float32

  # GQA attention — must stay aligned with Phalanx layers::Attention
  attention:
    num_heads: 12
    num_kv_heads: 4
    head_dim: 64
    dropout: 0.0
    causal: true
    bias: false
    device: cpu
    dtype: float32

  # SwiGLU FFN — must stay aligned with Phalanx layers::SwiGlu
  feed_forward:
    type: swiglu
    hidden_size: 768
    intermediate_size: 2048
    activation: silu
    device: cpu
    dtype: float32
